name: Master Catering Dashboard Sync

on:
  schedule:
    - cron: '15 * * * *' # Runs hourly at minute 15
  workflow_dispatch: # Allows manual trigger from github UI

jobs:
  scrape_orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Email Scraper
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: node scripts/email_scraper.js
        continue-on-error: true

      - name: Run ezCater Scraper
        run: node scripts/ezcater_scraper.js
        continue-on-error: true

      - name: Run ClubFeast Scraper
        run: node scripts/clubfeast_scraper.js
        continue-on-error: true

      - name: Run Cater2Me Scraper
        run: node scripts/cater2me_scraper.js
        continue-on-error: true

      - name: Run Hungry Scraper
        run: node scripts/hungry_scraper.js
        continue-on-error: true
